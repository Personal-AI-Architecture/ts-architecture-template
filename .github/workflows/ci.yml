name: Template CI Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout accepted PAA source
        uses: actions/checkout@v4
        with:
          repository: Personal-AI-Architecture/the-architecture
          ref: main
          fetch-depth: 0
          path: paa-source

      - name: Checkout shared PAA validator
        uses: actions/checkout@v4
        with:
          repository: Personal-AI-Architecture/paa-conformance-validator
          path: paa-validator

      - name: Validate current PAA source and template commands
        run: node paa-validator/bin/paa-validate.js --target paa.target.json --source-checkout paa-source --source-ref HEAD

      - name: Typecheck
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: Verify pinned PAA contracts
        run: npm run check:paa

      - name: Verify upstream PAA pin has not moved
        run: npm run check:paa:remote

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: node --test test/integration/*.test.js

      - name: Conformance tests
        run: npm run test:conformance

      - name: Contract checks
        run: node ./scripts/check-contracts.ts

      - name: Boundary import checks
        run: node ./scripts/check-imports.ts

      - name: Lock-in checks
        run: node ./scripts/check-lockin.ts

      - name: Acceptance check
        run: node ./scripts/acceptance-check.ts

      - name: Checkout shared PAA validator
        uses: actions/checkout@v4
        with:
          repository: Personal-AI-Architecture/paa-conformance-validator
          path: paa-validator

      - name: Validate running Gateway and restart persistence
        run: node paa-validator/bin/paa-live-target.js --target paa.target.json

      - name: Validate configured provider and model
        run: node paa-validator/bin/paa-provider-target.js --target paa.target.json
